<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Settings</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
    <style>
      body {
        background: #f3f5f8;
        color: #18243a;
      }
      main {
        max-width: 560px;
      }
    </style>
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h3 mb-4">Timer settings</h1>
      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <fieldset>
            <legend class="fs-6 fw-semibold">When the timer finishes</legend>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="notificationMode"
                id="notificationWindow"
                value="window"
              />
              <label class="form-check-label" for="notificationWindow"
                >Always-on-top app window</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="notificationMode"
                id="notificationSystem"
                value="system"
              />
              <label class="form-check-label" for="notificationSystem"
                >System notification</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="notificationMode"
                id="notificationBoth"
                value="both"
              />
              <label class="form-check-label" for="notificationBoth"
                >Both</label
              >
            </div>
          </fieldset>
        </div>
      </section>
      <section class="card shadow-sm mb-3">
        <div class="card-header fw-semibold">Countdown window</div>
        <div class="card-body">
          <label class="form-label" for="countdownFormat"
            >Remaining time format</label
          >
          <select id="countdownFormat" class="form-select">
            <option value="compact">Compact: 2m, 1m, &lt; 1m</option>
            <option value="clock">Clock: 00:01:51</option>
            <option value="seconds">Total seconds: 111s</option>
          </select>
          <label class="form-label mt-3" for="countdownFontSize"
            >Font size</label
          >
          <div class="d-flex align-items-center gap-3">
            <input
              id="countdownFontSize"
              class="form-range"
              type="range"
              min="8"
              max="32"
              step="1"
            />
            <output
              id="countdownFontSizeValue"
              for="countdownFontSize"
              class="text-nowrap"
              >15 pt</output
            >
          </div>
          <div class="form-check mt-2">
            <input
              id="countdownMenuButtonVisible"
              class="form-check-input"
              type="checkbox"
            />
            <label class="form-check-label" for="countdownMenuButtonVisible"
              >Show menu button</label
            >
          </div>
        </div>
      </section>
      <section class="card shadow-sm mb-3">
        <div class="card-header fw-semibold">Application</div>
        <div class="card-body">
          <div class="form-check">
            <input id="confirmQuit" class="form-check-input" type="checkbox" checked />
            <label class="form-check-label" for="confirmQuit">Ask for confirmation before quitting</label>
          </div>
        </div>
      </section>
      <section class="card shadow-sm mb-3">
        <div class="card-header fw-semibold">Colors</div>
        <div class="card-body">
          <div class="mb-3"><label class="form-label" for="trayIconColor">Tray icon background</label><div class="input-group"><input id="trayIconColor" class="form-control form-control-color flex-shrink-0" style="width:3.5rem" type="color"><span class="input-group-text">HEX</span><input id="trayIconColorHex" class="form-control font-monospace" type="text" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="Tray icon background HEX color" autocomplete="off" spellcheck="false"></div></div>
          <div class="mb-3"><label class="form-label" for="countdownBackgroundColor">Countdown window background</label><div class="input-group"><input id="countdownBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width:3.5rem" type="color"><span class="input-group-text">HEX</span><input id="countdownBackgroundColorHex" class="form-control font-monospace" type="text" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="Countdown window background HEX color" autocomplete="off" spellcheck="false"></div></div>
          <div class="mb-3"><label class="form-label" for="mainWindowBackgroundColor">Main window background</label><div class="input-group"><input id="mainWindowBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width:3.5rem" type="color"><span class="input-group-text">HEX</span><input id="mainWindowBackgroundColorHex" class="form-control font-monospace" type="text" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="Main window background HEX color" autocomplete="off" spellcheck="false"></div></div>
          <div class="mt-3"><label class="form-label" for="sectionHeaderBackgroundColor">Section header background</label><div class="input-group"><input id="sectionHeaderBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width:3.5rem" type="color"><span class="input-group-text">HEX</span><input id="sectionHeaderBackgroundColorHex" class="form-control font-monospace" type="text" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="Section header background HEX color" autocomplete="off" spellcheck="false"></div></div>
          <div class="mt-3"><label class="form-label" for="sectionBackgroundColor">Section background</label><div class="input-group"><input id="sectionBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width:3.5rem" type="color"><span class="input-group-text">HEX</span><input id="sectionBackgroundColorHex" class="form-control font-monospace" type="text" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="Section background HEX color" autocomplete="off" spellcheck="false"></div></div>
          <button id="resetColors" class="btn btn-link px-0 pb-0" type="button"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Reset colors to defaults</button>
        </div>
      </section>
      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <fieldset>
            <legend class="fs-6 fw-semibold">Alarm sound</legend>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="alarmSoundEnabled"
                id="alarmSoundEnabledYes"
                value="yes"
              />
              <label class="form-check-label" for="alarmSoundEnabledYes"
                >With sound</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="alarmSoundEnabled"
                id="alarmSoundEnabledNo"
                value="no"
              />
              <label class="form-check-label" for="alarmSoundEnabledNo"
                >Without sound</label
              >
            </div>
            <div id="alarmSoundOptions">
              <label class="form-label mt-3" for="alarmSound"
                >Sound variant</label
              >
              <div class="input-group">
                <select
                  id="alarmSound"
                  class="form-select"
                  aria-label="Alarm sound variant"
                >
                  <option value="classic">Classic</option>
                  <option value="digital">Digital</option>
                  <option value="gentle">Gentle</option>
                </select>
                <button
                  id="soundTestBtn"
                  class="btn btn-outline-secondary"
                  type="button"
                >
                  Test
                </button>
              </div>
            </div>
          </fieldset>
        </div>
      </section>
      <p id="settingsStatus" class="small text-secondary" role="status" aria-live="polite"></p>
      <div class="d-flex justify-content-end gap-2">
        <button id="settingsClose" class="btn btn-secondary" type="button"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Close</button>
        <button id="settingsApply" class="btn btn-outline-primary" type="button"><i class="fa-solid fa-check" aria-hidden="true"></i> Apply</button>
        <button id="settingsSave" class="btn btn-primary" type="button"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save</button>
      </div>
    </main>
    <script src="renderer/settings-renderer.js"></script>
  </body>
</html>
